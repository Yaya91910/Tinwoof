<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Page introuvable · Tinwoof</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff7f0; --ink: #1f1714; --ink-2: #66564f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15100e; --ink: #fbf3ee; --ink-2: #c7b8b0; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; }
    .art { width: 96px; height: 96px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%;
           background: linear-gradient(135deg, #ff7a45, #ff4d6d 55%, #e83e8c); font-size: 2.6rem; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
    p { margin: 0 auto 24px; max-width: 32ch; color: var(--ink-2); line-height: 1.5; }
    a { display: inline-block; padding: 14px 24px; border-radius: 999px; background: linear-gradient(135deg, #ff7a45, #ff4d6d 55%, #e83e8c);
        color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="art">🦴</div>
    <h1>Page introuvable</h1>
    <p>Ce chemin ne mène nulle part… même en suivant la piste.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
